name: branch-name

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          pattern='^overlay-text-studio/[a-z0-9]+(-[a-z0-9]+)*/[0-9]{4}/(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{2,}$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Required: overlay-text-studio/<feature>/YYYY/MM/DD/NN"
            exit 1
          fi
